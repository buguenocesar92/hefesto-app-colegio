# ---------------------------------------------------------------------------
# Colegio: entorno de PRODUCCIÓN
# ---------------------------------------------------------------------------
#
# Uso:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d
#
# QUÉ CAMBIA FRENTE A DESARROLLO
# ------------------------------
#  - Solo Caddy está expuesto. La API, PostgreSQL, Redis y Authentik quedan
#    en la red interna y no se pueden alcanzar desde afuera.
#  - No hay volúmenes de código: el código va DENTRO de la imagen.
#  - Se usan imágenes ya construidas, con etiqueta fija, no `build`.
#  - Redis y PostgreSQL exigen contraseña.
#  - La sesión usa cookie segura: sin HTTPS no hay sesión.
#
# ANTES DE LEVANTAR ESTO
# ----------------------
#  1. `APP_KEY`, `DB_PASSWORD`, `REDIS_PASSWORD`, `AUTHENTIK_SECRET_KEY`,
#     `AUTHENTIK_BOOTSTRAP__PASSWORD` y `AUTHENTIK_BOOTSTRAP__TOKEN` con
#     valores REALES, generados.
#  2. `SESSION_SECURE_COOKIE=true` (es el valor de más abajo).
#  3. `APP_ENV=production` y `APP_DEBUG=false`.
#  4. Las imágenes construidas y subidas al registro.
#
# ADVERTENCIA HONESTA: este archivo no se levantó nunca. No había Docker en el
# entorno donde se escribió el código. Ver docs/10.
# ---------------------------------------------------------------------------

name: colegio-prod

services:
  # -------------------------------------------------------------------------
  # Caddy: el único punto de entrada.
  #
  # TLS automático, redirección de HTTP a HTTPS y los encabezados de
  # seguridad. Ver deploy/caddy/Caddyfile.
  # -------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en el .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config

  # -------------------------------------------------------------------------
  # API (Laravel + php-fpm).
  # -------------------------------------------------------------------------
  api:
    image: ${API_IMAGE:?falta API_IMAGE en el .env.prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Colegio"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?falta APP_KEY en el .env.prod}
      APP_URL: ${APP_URL:?falta APP_URL en el .env.prod}
      LOG_CHANNEL: stack
      LOG_LEVEL: warning

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?falta DB_DATABASE en el .env.prod}
      DB_USERNAME: ${DB_USERNAME:?falta DB_USERNAME en el .env.prod}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env.prod}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en el .env.prod}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      # Sin HTTPS no hay sesión. En producción esto es obligatorio.
      SESSION_SECURE_COOKIE: "true"

      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:?falta AUTHENTIK_ISSUER en el .env.prod}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?falta AUTHENTIK_CLIENT_ID en el .env.prod}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:?falta AUTHENTIK_CLIENT_SECRET en el .env.prod}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:?falta AUTHENTIK_REDIRECT_URI en el .env.prod}
      AUTHENTIK_SCOPES: ${AUTHENTIK_SCOPES:-openid profile email}
      AUTHENTIK_GRUPO_ADMIN: ${AUTHENTIK_GRUPO_ADMIN:-colegio-direccion}
      AUTHENTIK_ALGORITMO: ${AUTHENTIK_ALGORITMO:-RS256}

      COLEGIO_RETENCION_BITACORA_HORAS: ${COLEGIO_RETENCION_BITACORA_HORAS:-8760}
      COLEGIO_ROLES_CONDUCTA: ${COLEGIO_ROLES_CONDUCTA:-direccion,orientacion,docente}
      COLEGIO_POR_PAGINA_MAXIMO: ${COLEGIO_POR_PAGINA_MAXIMO:-100}
    volumes:
      # Solo el almacenamiento de Laravel. El código va en la imagen.
      - api-storage:/var/www/html/storage

  # -------------------------------------------------------------------------
  # Trabajador de colas.
  # -------------------------------------------------------------------------
  cola:
    image: ${API_IMAGE:?falta API_IMAGE en el .env.prod}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: stack
      LOG_LEVEL: warning

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      COLEGIO_ROLES_CONDUCTA: ${COLEGIO_ROLES_CONDUCTA:-direccion,orientacion,docente}
    volumes:
      - api-storage:/var/www/html/storage

  # -------------------------------------------------------------------------
  # Interfaz (Nuxt).
  # -------------------------------------------------------------------------
  web:
    image: ${WEB_IMAGE:?falta WEB_IMAGE en el .env.prod}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:8080
      NUXT_PUBLIC_BASE: ${APP_WEB_URL:?falta APP_WEB_URL en el .env.prod}

  # -------------------------------------------------------------------------
  # PostgreSQL. NO se publica: es inaccesible desde Internet.
  # -------------------------------------------------------------------------
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
  # se usa para crear la base y para las tareas administrativas. La
  # aplicacion NUNCA conecta con el.
  #
  # El rol de la aplicacion (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
  # para que las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
  # superusuarios "always bypass the row security system", y que
  # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
  # superusuario. Con un solo rol las politicas no se aplicarian y el
  # aislamiento entre empresas seria decorativo. Ver docs/03.
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-colegio_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env.prod}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-colegio_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env.prod}
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-colegio_app} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Redis. NO se publica y exige contrasena.
  # -------------------------------------------------------------------------
  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Authentik. NO se publica.
  # -------------------------------------------------------------------------
  authentik-postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - authentik-postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_POSTGRESQL__USER:-authentik}"]
      interval: 10s
      timeout: 5s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: server
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_BOOTSTRAP__EMAIL: ${AUTHENTIK_BOOTSTRAP__EMAIL}
      AUTHENTIK_BOOTSTRAP__PASSWORD: ${AUTHENTIK_BOOTSTRAP__PASSWORD}
      AUTHENTIK_BOOTSTRAP__TOKEN: ${AUTHENTIK_BOOTSTRAP__TOKEN}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik-media:/media

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_BOOTSTRAP__EMAIL: ${AUTHENTIK_BOOTSTRAP__EMAIL}
      AUTHENTIK_BOOTSTRAP__PASSWORD: ${AUTHENTIK_BOOTSTRAP__PASSWORD}
      AUTHENTIK_BOOTSTRAP__TOKEN: ${AUTHENTIK_BOOTSTRAP__TOKEN}
    volumes:
      - authentik-media:/media

volumes:
  postgres-datos:
  authentik-postgres-datos:
  authentik-media:
  caddy-datos:
  caddy-config:
  api-storage: