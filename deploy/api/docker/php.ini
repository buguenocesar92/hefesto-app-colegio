; ---------------------------------------------------------------------------
; Configuración de PHP para la API del Colegio
; ---------------------------------------------------------------------------
;
; Los valores están puestos por razones concretas, no por defecto.
;
; ---------------------------------------------------------------------------

[PHP]
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; El tamaño de memoria es holgado porque el contexto de tenant y la
; validación pueden traer estructuras grandes, pero no infinito: un
; `memory_limit` sin techo en un servidor con datos de menores es una
; superficie de denegación de servicio.
memory_limit = 256M

; Tope de entrada de PHP. Coincide con el `client_max_body_size` de nginx.
post_max_size = 12M
upload_max_filesize = 12M

; Tiempo máximo de ejecución. Las llamadas al proveedor de identidad tienen
; su propio timeout de 5 segundos; este es el tope duro.
max_execution_time = 30

; ---------------------------------------------------------------------------
; Sesión
; ---------------------------------------------------------------------------
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_samesite = "Lax"

; ---------------------------------------------------------------------------
; Fecha y hora
; ---------------------------------------------------------------------------
; Zona horaria de Chile. Importa: los registros van por fecha, y "el día" no
; significa lo mismo en Santiago que en UTC.
date.timezone = America/Santiago

; ---------------------------------------------------------------------------
; OpCache
; ---------------------------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

[opcache]
opcache.enable_cli = 0