server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Datos de menores: el tamaño de cuerpo se limita para que un envío
    # desmedido no pueda agotar la memoria del servidor.
    client_max_body_size 12M;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        include fastcgi_params;

        # La API responde JSON: sin que nadie pueda meter HTML en la
        # respuesta.
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $https if_not_empty;
    }

    # No se sirven archivos ocultos (.env, .git, etc.) aunque estén en el
    # volumen.
    location ~ /\. {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}