; ---------------------------------------------------------------------------
; Supervisor: corre nginx y php-fpm en el mismo contenedor
; ---------------------------------------------------------------------------
;
; Es el patrón soportado para una imagen de PHP que necesita servir HTTP. No
; es un problema cuando es una sola réplica; sí lo sería con varias, y en ese
; caso la corrección es un nginx o php-fpm por contenedor.
;
; ---------------------------------------------------------------------------

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0